[project]
name = "llm-tutor"
version = "0.1.0"
description = "LLM-тьютор по курсу машинного обучения (mlcourse.ai, topic01 «Pandas / EDA»)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.0,<4.0",
    "httpx>=0.28,<0.29",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "networkx>=3.0,<4.0",
    "beautifulsoup4>=4.12,<5.0",
    "markdownify>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=1.0,<2.0",
    "respx>=0.22,<0.23",
    "pytest-cov>=5.0,<8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_tutor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
