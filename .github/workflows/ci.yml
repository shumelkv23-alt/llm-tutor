name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Python tests (without browser)
        run: uv run pytest -q

      - name: JavaScript syntax
        run: |
          for file in src/llm_tutor/web/static/js/*.js; do
            node --check "$file"
          done

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Browser tests
        run: uv run pytest -q -m e2e tests/e2e
